name: CI

on:
  push:
  pull_request:

jobs:
  java-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Run Java tests with coverage
        run: ./gradlew test integrationTest jacocoTestReport --no-daemon

      - name: Upload Java coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/test

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run Python tests with coverage
        run: |
          PYTHONPATH=src/main/python python -m coverage run -m unittest discover -s src/test/python/tests -v
          PYTHONPATH=src/main/python python -m coverage run -a -m unittest discover -s src/test/python/integration -v
          python -m coverage report
          python -m coverage xml

      - name: Upload Python coverage report
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-report
          path: coverage.xml
